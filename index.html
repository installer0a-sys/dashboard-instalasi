<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Instalasi</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a73e8">
    <style>
        body, html {
            margin: 0; padding: 0;
            height: 100%; overflow: hidden;
            background-color: #ffffff;
        }
        iframe {
            width: 100%; height: 100%;
            border: none; margin: 0; padding: 0;
        }
    </style>
</head>
<body>

    <!-- GANTI DENGAN LINK WEB APP APPS SCRIPT ANDA YANG BARU -->
    <iframe src="https://sites.google.com/view/dashboard-instalasi"></iframe>

    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').then(reg => {
                // Memeriksa jika ada update berkala
                reg.addEventListener('updatefound', () => {
                    const newWorker = reg.installing;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            // Otomatis muat ulang halaman saat update selesai didownload
                            window.location.reload();
                        }
                    });
                });
            });
        });
    }
</script>
</body>
</html>
